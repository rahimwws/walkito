name: Release

# On demand. (It used to run on every push to main.)
#
# Pushing is enough for the common case. A JavaScript or asset change goes out
# over the air by itself — that is safe to automate because the checks gate it,
# the runtime fingerprint proves the binary can run it, and a bad one is undone
# with `eas update:rollback`.
#
# A native change is a different thing entirely: it needs a store build, and on
# production an App Store review that cannot be taken back. That build is
# made on the Mac (AGENTS.md, "Builds and releases"), so the workflow stops.
#
# Manual only for now: a push to main no longer starts it. Run it with
#   eas workflow:run release.yml
# and put the `push` trigger back when releases should follow main again.
on:
  workflow_dispatch: {}

jobs:
  verify:
    name: Checks
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: bun run verify

  decide:
    name: Update or build?
    needs: [verify]
    outputs:
      verdict: ${{ steps.decide.outputs.verdict }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Compare this commit's native fingerprint with the live build
        id: decide
        # An update replaces JavaScript and assets inside a binary that already
        # exists. It cannot add a native module or change an entitlement, so the
        # only question that matters is whether the native layer moved — which
        # under the fingerprint runtime policy is a hash comparison rather than
        # a judgement call.
        run: |
          RESULT=$(node scripts/can-update.mjs --channel production --platform ios --json)
          echo "$RESULT"
          VERDICT=$(echo "$RESULT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).verdict))")
          set-output verdict "$VERDICT"

  update:
    name: Publish update
    needs: [decide]
    if: ${{ needs.decide.outputs.verdict == 'update' }}
    type: update
    environment: production
    params:
      branch: main
      platform: ios

  # A native change is built and uploaded on the Mac, never here: see
  # "Builds and releases" in AGENTS.md (bun run build:ios, submit:ios).
  needs_build:
    name: Native change - build locally
    needs: [decide]
    if: ${{ needs.decide.outputs.verdict == 'build' }}
    steps:
      - run: |
          echo "The fingerprint changed: no update can reach the live build."
          echo "Build and upload on the Mac: bun run build:ios && bun run submit:ios"
          exit 1
